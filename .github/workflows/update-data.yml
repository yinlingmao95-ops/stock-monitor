name: Update market data snapshot
on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # every 30 min during US trading hours (UTC)
    - cron: '15 22 * * 1-5'        # after close
    - cron: '0 */6 * * 0,6'        # weekends (Brent futures / sanity)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Yahoo Finance data
        run: python scripts/fetch_data.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "data: update market snapshot" && git push)
